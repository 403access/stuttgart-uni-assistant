<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Seite nicht gefunden — University Assistant</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#004191" />
    <link rel="icon" href="https://403access.github.io/stuttgart-uni-assistant/assets/favicon.svg" type="image/svg+xml" />
    <style>
      :root { --ink: #23292e; --ink-soft: #5e666e; --blue: #004191; --line: #e1e5e8; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        color: var(--ink);
        background: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        line-height: 1.6;
      }
      main { max-width: 680px; }
      .eyebrow { margin: 0 0 8px; font-size: .75rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--blue); }
      h1 { margin: 0; font-size: clamp(2rem, 6vw, 3rem); line-height: 1.1; letter-spacing: -.02em; }
      p { color: var(--ink-soft); margin: 16px 0 0; }
      .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
      a.btn { display: inline-flex; padding: 12px 20px; border-radius: 999px; font-weight: 700; text-decoration: none; }
      .primary { background: var(--blue); color: #fff; }
      .secondary { border: 1px solid var(--line); color: var(--blue); }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">404</p>
      <h1>Seite nicht gefunden</h1>
      <p>Diese Seite gibt es nicht (mehr). Vielleicht findest du sie über die Startseite oder die Dokumentation.</p>
      <p lang="en">This page does not exist. Try the home page or the documentation.</p>
      <div class="actions">
        <a class="btn primary" href="https://403access.github.io/stuttgart-uni-assistant/">Zur Startseite</a>
        <a class="btn secondary" href="https://403access.github.io/stuttgart-uni-assistant/docs/">Dokumentation</a>
      </div>
    </main>
  </body>
</html>
